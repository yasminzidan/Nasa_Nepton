<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الشخصي</title>
  <link rel="stylesheet" href="bot.css">
</head>
<body>

  <!-- محتوى موقعك يوضع هنا -->
  <main style="padding: 40px; text-align: center;">
    <h1>أهلاً بك في موقعي</h1>
    <p>اضغط على أيقونة المحادثة أسفل اليمين للتحدث مع المساعد الذكي.</p>
  </main>

  <!-- زر أيقونة الشات العائم أسفل اليمين -->
  <button id="chatToggleBtn" class="chat-toggle-btn" aria-label="فتح المحادثة">
    <img src="WhatsApp Image 2026-11-11 at 12.35.24 PM.jpeg" alt="Chat Avatar" />
  
  </button>

  <!-- نافذة الشات بوت المنبثقة -->
  <div id="chatWidget" class="chat-widget hidden">
    <div class="chat-header">
      <span>المساعد الذكي</span>
      <button id="closeChatBtn" class="close-btn" aria-label="إغلاق">✕</button>
    </div>
    
    <div class="chat-box" id="chatBox">
      <div class="message bot-msg">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    
    <div class="input-area">
      <input type="text" id="userInput" placeholder="اكتب سؤالك هنا...">
      <button id="sendBtn">إرسال</button>
    </div>
  </div>

  <script src="bot.js"></script>
</body>
</html>
